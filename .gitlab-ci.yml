variables:
    EXPO_NO_KEYCHAIN: 1
    EXPO_TOKEN: $EXPO_TOKEN
    EXPO_APPLE_APP_SPECIFIC_PASSWORD: $EXPO_APPLE_APP_SPECIFIC_PASSWORD
    GITLAB_TOKEN: $GITLAB_TOKEN
    GITLAB_USERNAME: $GITLAB_USERNAME
    COMMIT_MESSAGE: $COMMIT_MESSAGE

stages:          # List of stages for jobs, and their order of execution
  - build
  - submit
  - ota
  - version

build-ios:       # This job runs in the build stage, which runs first.
    stage: build
    script:
        - echo "Build IOS app ..."
        - yarn
        - yarn build:ios
    rules:
        - if: $CI_COMMIT_TAG =~ /^submit-ios\d*- */
          when: on_success
        - when: never
    artifacts:
        paths:
        - app.ipa
        - app.json
    tags:
        - ios-builder

build-android:
    stage: build
    script:
        - echo "Build Android app ..."
        - yarn
        - yarn build:android
    rules:
        - if: $CI_COMMIT_TAG =~ /^submit-android\d*- */
          when: on_success
        - when: never
    tags:
        - ios-builder

submit-ios:
    stage: submit
    needs:
        - build-ios
    script:
        - echo "Submit IOS app ..."
        - yarn
        - yarn submit:ios
    rules:
        - if: $CI_COMMIT_TAG =~ /^submit-ios\d*- */
          when: on_success
        - when: never   
    tags:
        - ios-builder 
    extends: .git:push

submit-android:
    stage: submit
    needs:
        - build-android
    script:
        - echo "Submit Android app ..."
        - yarn
        - yarn submit:android
    artifacts:
        paths:
        - app.aab
    rules:
        - if: $CI_COMMIT_TAG =~ /^submit-android\d*- */
          when: on_success
        - when: never
    tags:
        - ios-builder

ota-push:
    stage: ota
    needs:
        - build-ios
        - build-android
    before_script:
        - echo "Overide App ..."
        - cp RealApp.js App.js
    script:
        - echo "Push ota update ..."
        - yarn
        - yarn ota
    rules:
        - if: $CI_COMMMIT_TAG =~ /^push-update\d*- */
          when: on_success
        - when: never
    tags:
        - ios-builder

.git:push:
    before_script:
        - echo "clone git"
        - git clone -b $CI_COMMIT_BRANCH "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${CI_COMMIT_SHA}"
        - git config --global user.email "${GIT_USER_EMAIL:-$GITLAB_USER_EMAIL}"
        - git config --global user.name "${GIT_USER_NAME:-$GITLAB_USER_NAME}"
        - echo "clone done"
    after_script:
        - cd "${CI_COMMIT_SHA}"
        - git add app.json
        - |-
            CHANGES=$(git status --porcelain | wc -l)
            if [ "$CHANGES" -gt "0" ]; then
                git status
                git commit -m "${COMMIT_MESSAGE}"
                git push origin "${CI_COMMIT_BRANCH}" -o ci.skip
            fi
    stage: sumbit
